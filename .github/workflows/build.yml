name: build-and-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Native unit tests
        run: make test

      - name: Build Teensy 4.0 (O_C hardware)
        run: pio run -e teensy40

      - name: Build Teensy 4.1 (O_C hardware)
        run: pio run -e teensy41

      - name: Stage hex files
        run: |
          mkdir -p dist
          cp .pio/build/teensy40/firmware.hex dist/pams-newer-crime-teensy40.hex
          cp .pio/build/teensy41/firmware.hex dist/pams-newer-crime-teensy41.hex

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-hex
          path: dist/*.hex

      - name: Release with hex assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.hex
          generate_release_notes: true

      - name: Publish hexes to docs/firmware for the web flasher
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$DEFAULT_BRANCH"
          branch="ci/publish-${{ github.ref_name }}-${{ github.run_id }}"
          git checkout -B "$branch" "origin/$DEFAULT_BRANCH"
          mkdir -p docs/firmware
          cp dist/*.hex docs/firmware/
          git add -f docs/firmware
          if git diff --cached --quiet -- docs/firmware; then echo "unchanged"; exit 0; fi
          git commit -m "CI: publish ${{ github.ref_name }} hexes for web flasher"
          git push origin "$branch"
          gh pr create \
            --base "$DEFAULT_BRANCH" \
            --head "$branch" \
            --title "CI: publish ${{ github.ref_name }} hexes for web flasher" \
            --body "Auto-generated firmware binaries for the web flasher."
