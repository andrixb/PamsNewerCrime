[env]
platform = teensy
framework = arduino
lib_deps =
	adafruit/Adafruit GFX Library@^1.11.9
	adafruit/Adafruit BusIO@^1.16.0

; ---- default builds: genuine O_C hardware (Teensy 4.0 / 4.1 drop-in) ----

[env:teensy40]
board = teensy40
build_flags = -DNUM_OUTPUTS=4

[env:teensy41]
board = teensy41
build_flags = -DNUM_OUTPUTS=4

; ---- DIY breadboard profile: I2C OLED + MCP4822 DACs ----
; display controller (SSD1306/SH1106) is chosen on the SYS page, no separate build

[env:teensy40_diy]
board = teensy40
build_flags = -DNUM_OUTPUTS=4 -DHARDWARE_DIY
lib_deps =
	${env.lib_deps}
	adafruit/Adafruit SSD1306@^2.5.9
	adafruit/Adafruit SH110X@^1.0.6

[env:teensy41_diy]
board = teensy41
build_flags = -DNUM_OUTPUTS=8 -DHARDWARE_DIY
lib_deps = ${env:teensy40_diy.lib_deps}
