[env]
platform = teensy
framework = arduino
lib_deps =
	adafruit/Adafruit GFX Library@^1.11.9
	adafruit/Adafruit BusIO@^1.16.0

; Local dev defaults: `pio run` builds this env, `pio run -t upload` /
; `pio device monitor` target it too. Override with `-e teensy41` for a 4.1.
default_envs = teensy40

; ---- builds: genuine O_C hardware (Teensy 4.0 / 4.1 drop-in) ----

[env:teensy40]
board = teensy40
build_flags = -DNUM_OUTPUTS=4
upload_protocol = teensy-cli
monitor_speed = 115200

[env:teensy41]
board = teensy41
build_flags = -DNUM_OUTPUTS=4
upload_protocol = teensy-cli
monitor_speed = 115200
