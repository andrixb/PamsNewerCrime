[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
build_flags = -DNUM_OUTPUTS=4
lib_deps =
	adafruit/Adafruit SSD1306@^2.5.9
	adafruit/Adafruit SH110X@^1.0.6
	adafruit/Adafruit GFX Library@^1.11.9
	adafruit/Adafruit BusIO@^1.16.0

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags = -DNUM_OUTPUTS=8
lib_deps =
	adafruit/Adafruit SSD1306@^2.5.9
	adafruit/Adafruit SH110X@^1.0.6
	adafruit/Adafruit GFX Library@^1.11.9
	adafruit/Adafruit BusIO@^1.16.0

[env:teensy40_8out]
platform = teensy
board = teensy40
framework = arduino
build_flags = -DNUM_OUTPUTS=8
lib_deps = ${env:teensy40.lib_deps}

[env:teensy40_sh1106]
platform = teensy
board = teensy40
framework = arduino
build_flags = -DNUM_OUTPUTS=4 -DDISPLAY_SH1106=1
lib_deps = ${env:teensy40.lib_deps}

[env:teensy41_sh1106]
platform = teensy
board = teensy41
framework = arduino
build_flags = -DNUM_OUTPUTS=8 -DDISPLAY_SH1106=1
lib_deps = ${env:teensy41.lib_deps}
